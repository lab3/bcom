<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bucchino.com</title>
    <style>
        body {
            margin: 0;
            height: 100vh; /* Full viewport height */
            display: flex;
            justify-content: center; /* Center horizontally */
            align-items: flex-start; /* Align to top initially */
            overflow: hidden; /* Optional: prevent scrolling if content fits */
        }

        .image-container {
            margin-top: calc(100vh / 4); /* Position 1/3 down from the top */
        }

        img {
            max-width: 100%; /* Ensure image doesn't overflow */
            height: auto; /* Maintain aspect ratio */
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="logo.svg" alt="bucchino.com">
    </div>
</body>
</html>
